apiVersion: apps/v1
kind: Deployment

metadata:
  name: task-management-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: task-management-api

  template:
    metadata:
      labels:
        app: task-management-api

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: task-management-api
          image: ghcr.io/valinfernanda/task-management-api:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8000
